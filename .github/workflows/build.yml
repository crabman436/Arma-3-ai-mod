name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up HEMTT
        uses: arma-actions/hemtt@v1
      - name: Build mod
        run: hemtt build
      - name: Upload @CoordinatedAI
        uses: actions/upload-artifact@v4
        with:
          name: "@CoordinatedAI"
          path: .hemttout/build/*
