[package]
name = "aic_jev"
version = "1.0.0"
edition = "2024"
description = "AI Commander (Arma 3) native extension: asks the Jev decision model over HTTPS on a worker thread"
publish = false

[lib]
name = "aic_jev"
# cdylib is what Arma loads; rlib lets the integration test in tests/ link the crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
arma-rs = "1.13"
serde_json = "1"
# rustls + bundled webpki roots: pure Rust TLS, no OpenSSL, cross-compiles cleanly.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
